apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ziad-devops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ziadchabane/ziad-devops-180'
    targetRevision: HEAD
    path: helm/ziad-devops
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
