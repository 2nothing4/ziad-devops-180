replicaCount: 2

image:
  repository: ziad-devops-api
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 5000

nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: alpine
    pullPolicy: Never
  service:
    type: NodePort
    port: 8080

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  storage:
    size: 1Gi
  credentials:
    user: ziad
    password: ziadpass
    db: ziad_devops

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: latest
  adminPassword: admin123

resources:
  api:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  nginx:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  postgres:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  redis:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
