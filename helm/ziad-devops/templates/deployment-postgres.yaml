apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgres.credentials.user }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgres.credentials.password }}
        - name: POSTGRES_DB
          value: {{ .Values.postgres.credentials.db }}
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: {{ .Values.resources.postgres.requests.memory }}
            cpu: {{ .Values.resources.postgres.requests.cpu }}
          limits:
            memory: {{ .Values.resources.postgres.limits.memory }}
            cpu: {{ .Values.resources.postgres.limits.cpu }}
