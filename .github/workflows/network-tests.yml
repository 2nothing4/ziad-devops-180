name: Network Policy Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-network:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: net-test-cluster
          config: kind-config.yaml

      - name: Install Calico
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=120s

      - name: Run DNS Test
        run: |
          kubectl create namespace net-test
          kubectl run test-pod -n net-test --image=busybox --restart=Never -- sleep 3600
          kubectl wait --for=condition=Ready pod/test-pod -n net-test --timeout=60s
          echo "Testing DNS..."
          kubectl exec -n net-test test-pod -- nslookup google.com
      
      - name: Deploy API Deployment
        run: |
          kubectl create deployment api --image=python:3.12-alpine -- sleep 3600
          kubectl rollout status deployment/api --timeout=90s

      - name: Deploy PostgreSQL Service
        run: |
          kubectl run postgresql --image=postgres:15-alpine --env="POSTGRES_PASSWORD=test" --labels="app=postgres"
          kubectl expose pod postgresql --name=postgres --port=5432
          kubectl wait --for=condition=Ready pod/postgresql --timeout=60s

      - name: Apply NetworkPolicies
        run: |
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny-all
            namespace: default
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-api-to-postgres
            namespace: default
          spec:
            podSelector:
              matchLabels:
                app: postgres
            policyTypes:
            - Ingress
            ingress:
            - from:
              - podSelector:
                  matchLabels:
                    app: api
              ports:
              - protocol: TCP
                port: 5432
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: default-deny-all
            namespace: net-test
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            - Egress
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-dns
            namespace: net-test
          spec:
            podSelector: {}
            policyTypes:
            - Egress
            egress:
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
              ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          EOF

      - name: Run Network Policy Test Script
        run: |
          chmod +x test-network.sh
          ./test-network.sh