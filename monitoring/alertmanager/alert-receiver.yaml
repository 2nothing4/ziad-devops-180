apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver-script
  namespace: default
data:
  alert-receiver.py: |
    from flask import Flask, request
    import json
    from datetime import datetime

    app = Flask(__name__)

    @app.route('/webhook', methods=['POST'])
    def webhook():
        data = request.json
        print(f"\n{'='*60}")
        print(f"ALERT RECEIVED at {datetime.now()}")
        print(f"{'='*60}")
        for alert in data.get('alerts', []):
            status = alert.get('status', 'unknown')
            name = alert.get('labels', {}).get('alertname', 'unknown')
            severity = alert.get('labels', {}).get('severity', 'unknown')
            summary = alert.get('annotations', {}).get('summary', 'no summary')
            print(f"\nStatus: {status.upper()}")
            print(f"Alert: {name}")
            print(f"Severity: {severity}")
            print(f"Summary: {summary}")
        print(f"{'='*60}\n")
        return "OK", 200

    if __name__ == '__main__':
        app.run(host='0.0.0.0', port=5001)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      containers:
      - name: alert-receiver
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - pip install flask --quiet && python3 /app/alert-receiver.py
        ports:
        - containerPort: 5001
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: alert-receiver-script
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: default
spec:
  selector:
    app: alert-receiver
  ports:
  - port: 5001
    targetPort: 5001
