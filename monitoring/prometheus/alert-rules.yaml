apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: default
data:
  alert-rules.yml: |
    groups:
    - name: flask-alerts
      rules:
      - alert: FlaskAPIDown
        expr: up{job="flask"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flask API is down"
          description: "Flask API has been down for more than 1 minute."
      
      - alert: HighErrorRate
        expr: rate(flask_http_request_duration_seconds_count{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Flask API"
          description: "Error rate is above 10% for more than 2 minutes."
